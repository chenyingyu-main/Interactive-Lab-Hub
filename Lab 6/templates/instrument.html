<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Instrument Events</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, Roboto, "Segoe UI", Arial; margin: 0; padding: 16px; background: #0f1724; color: #e6eef8; }
        header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
        h1 { font-size:18px; margin:0; }
        #events { display:grid; grid-template-columns: 1fr 320px; gap:16px; }
        .panel { background: #081025; border-radius:8px; padding:12px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
        .list { max-height: 60vh; overflow:auto; }
        .event { padding:8px; border-bottom:1px solid rgba(255,255,255,0.03); }
        .event small { color:#9fb3d6; }
        .coord { padding:12px; border-radius:6px; background:#052b11; color:#b7f7c5; margin-bottom:8px; }
        .idle { color:#9fb3d6; }
        .badge { display:inline-block; padding:4px 8px; border-radius:999px; background:#06315a; color:#a7d1ff; font-size:12px; }
    </style>
</head>
<body>
    <header>
        <h1>Kitchen Instrument Events</h1>
        <div class="badge" id="status">connecting...</div>
    </header>

    <div id="events">
        <div class="panel">
            <h3>Recent Events</h3>
            <div class="list" id="recent"></div>
        </div>

        <div class="panel">
            <h3>Coordinator</h3>
            <div id="coord-area">
                <div class="idle">Waiting for instrument events...</div>
            </div>
            <hr/>
            <h4>Rules</h4>
            <ul>
                <li>When two different devices report the same <code>utensil</code> within 5s, a "Synchronized" event is shown.</li>
                <li>Click a recent event to highlight and simulate a manual confirm action.</li>
            </ul>
        </div>
    </div>

    <script>
        const socket = io();
        const recentEl = document.getElementById('recent');
        const statusBadge = document.getElementById('status');
        const coordArea = document.getElementById('coord-area');

        let recent = []; // newest first

        // Track utensil occurrences: { utensil: [{mac, timestamp}] }
        const utensilMap = {};

        const COORD_WINDOW = 5000; // ms

        function renderRecent() {
            recentEl.innerHTML = '';
            for (const ev of recent) {
                const div = document.createElement('div');
                div.className = 'event';
                div.innerHTML = `
                    <div><strong>${ev.utensil}</strong> <small>– ${ev.mac.slice(0,17)}</small></div>
                    <div><small>${new Date(ev.timestamp*1000).toLocaleTimeString()}</small></div>
                `;
                div.addEventListener('click', ()=>{ highlightEvent(ev); });
                recentEl.appendChild(div);
            }
        }

        function highlightEvent(ev){
            coordArea.innerHTML = '';
            const d = document.createElement('div');
            d.className = 'coord';
            d.innerHTML = `<strong>Manual confirm</strong><div>${ev.utensil} by ${ev.mac.slice(0,17)}</div>`;
            coordArea.appendChild(d);
            // simulate confirming – in real app we might emit back to server
        }

        function addEvent(ev){
            recent.unshift(ev);
            if (recent.length > 200) recent.pop();
            renderRecent();

            // handle coordination logic
            const now = Date.now();
            if (!utensilMap[ev.utensil]) utensilMap[ev.utensil] = [];
            utensilMap[ev.utensil].push({mac: ev.mac, t: now});

            // prune old
            utensilMap[ev.utensil] = utensilMap[ev.utensil].filter(x => now - x.t <= COORD_WINDOW);

            // check for >=2 distinct macs
            const macs = [...new Set(utensilMap[ev.utensil].map(x=>x.mac))];
            if (macs.length >= 2) {
                showSynchronized(ev.utensil, macs);
                // clear entries for this utensil to avoid repeated triggers
                utensilMap[ev.utensil] = [];
            } else {
                // update coordinator UI with last reporter
                coordArea.innerHTML = `<div class="idle">Last: <strong>${ev.utensil}</strong> by ${ev.mac.slice(0,17)} <small>(${new Date(ev.timestamp*1000).toLocaleTimeString()})</small></div>`;
            }
        }

        function showSynchronized(utensil, macs){
            coordArea.innerHTML = '';
            const d = document.createElement('div');
            d.className = 'coord';
            d.innerHTML = `<strong>Synchronized</strong><div>Utensil: ${utensil}</div><div>Devices: ${macs.map(m=>m.slice(0,17)).join(', ')}</div>`;
            coordArea.appendChild(d);
            // flash status
            statusBadge.textContent = 'synced';
            statusBadge.style.background = '#114b2b';
            setTimeout(()=>{ statusBadge.textContent = 'online'; statusBadge.style.background=''; }, 3000);
        }

        socket.on('connect', ()=>{
            statusBadge.textContent = 'online';
        });

        socket.on('disconnect', ()=>{
            statusBadge.textContent = 'disconnected';
        });

        socket.on('instrument_event', (data)=>{
            try{
                // Expected: {mac, ip, utensil, timestamp, is_new, total}
                const ev = {
                    mac: data.mac || 'unknown',
                    ip: data.ip || '',
                    utensil: data.utensil || 'unknown',
                    timestamp: data.timestamp || Math.floor(Date.now()/1000),
                    is_new: !!data.is_new,
                    total: data.total || 0
                };
                addEvent(ev);
            }catch(e){
                console.error('Bad instrument_event', e, data);
            }
        });

        // optional: fetch initial history by asking server (not implemented) – rely on live events
    </script>
</body>
</html>
